version: '3.8'

services:
  sns-api:
    build: .
    container_name: sns-api-container
    ports:
      - "3001:3001"
    environment:
      - DB_SERVER=192.168.24.50
      - DB_HOST=192.168.24.50
      - DB_DATABASE=CompanySNSDB
      - DB_NAME=CompanySNSDB
      - DB_USERNAME=sa
      - DB_USER=sa
      - DB_PASSWORD=TE!rana%go2361
      - PORT=3001
      - DRAWINGS_DIR=/app/data/drawings    # ★追加：図面参照用コンテナ内パス

      # --- SMTP メール送信設定（既存） ---
      - SMTP_HOST=111.89.134.68
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=nagoya-soumu2
      - SMTP_PASS=EJ2brys7
      - SMTP_FROM_EMAIL=nagoya-soumu2@teraoka-ads.co.jp
      - SMTP_FROM_NAME=寺岡SNS

