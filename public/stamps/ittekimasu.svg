<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="3" filter="url(#shadow)"/>
  
  <text x="100" y="32" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="14" fill="#0284C7" text-anchor="middle">I'm off!</text>
  <text x="45" y="70" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">行</text>
  <text x="45" y="98" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">っ</text>
  <text x="45" y="126" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">て</text>
  <text x="45" y="154" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">き</text>
  <text x="45" y="180" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">ます</text>

  <g transform="translate(25, 10)">
    <!-- Walking Legs -->
    <path d="M 85 140 L 75 160" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M 115 140 L 135 155 L 145 152" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Body Walking -->
    <path d="M 70 140 C 65 115, 130 115, 125 140 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Shoulder Bag Strap -->
    <path d="M 75 118 Q 100 135 122 145" stroke="#78350F" stroke-width="3" fill="none"/>
    <!-- Bag -->
    <rect x="115" y="138" width="18" height="14" rx="3" fill="#B45309" stroke="#78350F" stroke-width="2"/>

    <!-- Ears -->
    <path d="M 68 82 L 52 52 L 82 66 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 69 76 L 58 57 L 78 66 Z" fill="#FFD1DC"/>
    <path d="M 132 82 L 148 52 L 118 66 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 131 76 L 142 57 L 122 66 Z" fill="#FFD1DC"/>

    <!-- Head -->
    <ellipse cx="100" cy="90" rx="36" ry="30" fill="#FFFFFF" stroke="#334155" stroke-width="3.5"/>

    <!-- Antenna -->
    <line x1="100" y1="60" x2="100" y2="46" stroke="#334155" stroke-width="3"/>
    <circle cx="100" cy="44" r="6" fill="#FF5E80" stroke="#334155" stroke-width="2"/>
    <circle cx="98" cy="42" r="2" fill="#FFFFFF"/>

    <!-- Left Hand Waving Bye -->
    <path d="M 72 125 C 60 115, 52 105, 58 98 C 62 92, 70 105, 72 115" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="88" cy="88" rx="3.5" ry="5" fill="#1E293B"/>
    <ellipse cx="112" cy="88" rx="3.5" ry="5" fill="#1E293B"/>

    <!-- Cheeks -->
    <ellipse cx="80" cy="96" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>
    <ellipse cx="120" cy="96" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>

    <!-- Mouth -->
    <path d="M 94 95 Q 100 100 106 95" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tail Curved Up -->
    <path d="M 125 145 C 145 140, 150 120, 142 110" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
