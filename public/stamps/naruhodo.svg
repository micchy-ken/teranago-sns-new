<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#FEFCE8" stroke="#FDE047" stroke-width="3" filter="url(#shadow)"/>
  
  <text x="100" y="32" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="14" fill="#CA8A04" text-anchor="middle">Got it!</text>
  <text x="45" y="70" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">な</text>
  <text x="45" y="98" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">る</text>
  <text x="45" y="126" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">ほ</text>
  <text x="45" y="154" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">ど</text>
  <text x="45" y="180" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="24" fill="#0F172A">！</text>

  <g transform="translate(25, 10)">
    <!-- Body -->
    <path d="M 70 160 C 65 125, 135 125, 130 160 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Ears -->
    <path d="M 68 88 L 52 58 L 82 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 69 82 L 58 63 L 78 72 Z" fill="#FFD1DC"/>
    <path d="M 132 88 L 148 58 L 118 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 131 82 L 142 63 L 122 72 Z" fill="#FFD1DC"/>

    <!-- Head -->
    <ellipse cx="100" cy="98" rx="38" ry="32" fill="#FFFFFF" stroke="#334155" stroke-width="3.5"/>

    <!-- Antenna with Lit Lightbulb on Top -->
    <line x1="100" y1="66" x2="100" y2="52" stroke="#334155" stroke-width="3"/>
    <!-- Lightbulb -->
    <path d="M 94 40 C 90 32, 110 32, 106 40 L 104 46 L 96 46 Z" fill="#EAB308" stroke="#334155" stroke-width="2"/>
    <circle cx="100" cy="38" r="8" fill="#FACC15"/>
    <path d="M 98 46 L 102 46 M 98 48 L 102 48" stroke="#334155" stroke-width="2"/>
    <!-- Rays of Light -->
    <line x1="88" y1="30" x2="82" y2="24" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="24" x2="100" y2="18" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="112" y1="30" x2="118" y2="24" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Hand Touching Head in Idea Eureka Gesture -->
    <path d="M 72 135 C 65 125, 68 105, 78 100" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Surprised/Enlightened Eyes -->
    <circle cx="88" cy="95" r="4" fill="#334155"/>
    <circle cx="112" cy="95" r="4" fill="#334155"/>

    <!-- Cheeks -->
    <ellipse cx="80" cy="103" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>
    <ellipse cx="120" cy="103" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>

    <!-- Open 'O' Mouth -->
    <circle cx="100" cy="104" r="3" fill="#EF4444" stroke="#334155" stroke-width="1.5"/>
  </g>
</svg>
