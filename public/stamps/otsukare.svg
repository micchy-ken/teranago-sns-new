<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#FFFBEB" stroke="#FDE68A" stroke-width="3" filter="url(#shadow)"/>
  
  <text x="100" y="32" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="14" fill="#D97706" text-anchor="middle">Thanks for your hard work.</text>
  <text x="100" y="54" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="22" fill="#0F172A" text-anchor="middle">お疲れ様です</text>

  <g transform="translate(0, 10)">
    <!-- Body -->
    <path d="M 70 160 C 65 125, 135 125, 130 160 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Ears -->
    <path d="M 68 88 L 52 58 L 82 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 69 82 L 58 63 L 78 72 Z" fill="#FFD1DC"/>
    <path d="M 132 88 L 148 58 L 118 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 131 82 L 142 63 L 122 72 Z" fill="#FFD1DC"/>

    <!-- Head -->
    <ellipse cx="100" cy="98" rx="38" ry="32" fill="#FFFFFF" stroke="#334155" stroke-width="3.5"/>

    <!-- Antenna -->
    <line x1="100" y1="66" x2="100" y2="52" stroke="#334155" stroke-width="3"/>
    <circle cx="100" cy="50" r="6" fill="#FF5E80" stroke="#334155" stroke-width="2"/>
    <circle cx="98" cy="48" r="2" fill="#FFFFFF"/>

    <!-- Coffee Cup in Hands -->
    <path d="M 90 128 L 110 128 L 108 148 C 108 152, 92 152, 92 148 Z" fill="#78350F" stroke="#334155" stroke-width="3"/>
    <!-- Mug Handle -->
    <path d="M 110 132 C 117 132, 117 144, 109 144" fill="none" stroke="#334155" stroke-width="2.5"/>
    <!-- Arms holding mug -->
    <path d="M 72 135 C 80 132, 90 135, 92 142" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 128 135 C 120 132, 110 135, 108 142" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Steam -->
    <path d="M 95 122 C 92 115, 100 112, 97 105" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 105 122 C 102 115, 110 112, 107 105" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Contented Happy Eyes -->
    <path d="M 83 95 Q 88 90 93 95" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M 107 95 Q 112 90 117 95" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="78" cy="100" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>
    <ellipse cx="122" cy="100" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>

    <!-- Mouth -->
    <path d="M 96 102 Q 100 106 104 102" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="62" y1="96" x2="52" y2="94" stroke="#334155" stroke-width="2"/>
    <line x1="62" y1="101" x2="54" y2="102" stroke="#334155" stroke-width="2"/>
    <line x1="138" y1="96" x2="148" y2="94" stroke="#334155" stroke-width="2"/>
    <line x1="138" y1="101" x2="146" y2="102" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
