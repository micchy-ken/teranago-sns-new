<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="3" filter="url(#shadow)"/>
  
  <text x="100" y="32" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="14" fill="#DC2626" text-anchor="middle">Urgent!</text>
  <text x="45" y="85" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="32" fill="#DC2626">至</text>
  <text x="45" y="125" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="32" fill="#DC2626">急</text>
  <text x="45" y="165" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="32" fill="#DC2626">！</text>

  <g transform="translate(25, 10)">
    <!-- Frantic Running Motion Lines -->
    <path d="M 50 148 L 30 148" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M 55 155 L 38 155" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Running Legs -->
    <path d="M 85 140 L 70 155 L 60 150" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 115 140 L 135 148 L 145 142" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Body Leaning Forward -->
    <path d="M 70 140 C 65 115, 130 115, 125 140 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Ears -->
    <path d="M 68 82 L 52 52 L 82 66 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 69 76 L 58 57 L 78 66 Z" fill="#FFD1DC"/>
    <path d="M 132 82 L 148 52 L 118 66 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 131 76 L 142 57 L 122 66 Z" fill="#FFD1DC"/>

    <!-- Head -->
    <ellipse cx="100" cy="90" rx="36" ry="30" fill="#FFFFFF" stroke="#334155" stroke-width="3.5"/>

    <!-- Antenna Flashing Red -->
    <line x1="100" y1="60" x2="100" y2="46" stroke="#334155" stroke-width="3"/>
    <circle cx="100" cy="44" r="7" fill="#EF4444" stroke="#334155" stroke-width="2"/>
    <circle cx="98" cy="42" r="2.5" fill="#FFFFFF"/>

    <!-- Sweat Drops -->
    <path d="M 138 80 C 142 80, 145 86, 142 90 C 139 92, 135 90, 138 80 Z" fill="#38BDF8"/>
    <path d="M 148 92 C 151 92, 153 96, 151 99 C 149 101, 146 99, 148 92 Z" fill="#38BDF8"/>

    <!-- Shocked Eyes -->
    <circle cx="88" cy="88" r="6" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
    <circle cx="88" cy="88" r="2.5" fill="#334155"/>
    <circle cx="112" cy="88" r="6" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
    <circle cx="112" cy="88" r="2.5" fill="#334155"/>

    <!-- Open Panicked Mouth -->
    <ellipse cx="100" cy="100" rx="6" ry="7" fill="#EF4444" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
