<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="3" filter="url(#shadow)"/>
  
  <text x="45" y="60" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="14" fill="#059669">! Roger!</text>
  <text x="45" y="90" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="28" fill="#0F172A">了</text>
  <text x="45" y="118" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="28" fill="#0F172A">解</text>
  <text x="45" y="146" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="28" fill="#0F172A">で</text>
  <text x="45" y="174" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="28" fill="#0F172A">す</text>

  <g transform="translate(25, 10)">
    <!-- Body -->
    <path d="M 70 160 C 65 125, 135 125, 130 160 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Ears -->
    <path d="M 68 88 L 52 58 L 82 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 69 82 L 58 63 L 78 72 Z" fill="#FFD1DC"/>
    <path d="M 132 88 L 148 58 L 118 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 131 82 L 142 63 L 122 72 Z" fill="#FFD1DC"/>

    <!-- Head -->
    <ellipse cx="100" cy="98" rx="38" ry="32" fill="#FFFFFF" stroke="#334155" stroke-width="3.5"/>

    <!-- Antenna Glowing -->
    <line x1="100" y1="66" x2="100" y2="52" stroke="#334155" stroke-width="3"/>
    <circle cx="100" cy="50" r="6" fill="#10B981" stroke="#334155" stroke-width="2"/>
    <circle cx="98" cy="48" r="2" fill="#FFFFFF"/>
    <!-- Antenna Glow Rays -->
    <line x1="92" y1="42" x2="88" y2="38" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="38" x2="100" y2="34" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="42" x2="112" y2="38" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

    <!-- Thumbs Up Arm (Left) -->
    <path d="M 72 135 C 55 125, 45 110, 52 100 C 58 95, 68 108, 72 120" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Thumb -->
    <path d="M 48 102 C 45 92, 55 92, 54 102" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>

    <!-- Right Arm -->
    <path d="M 128 135 C 135 142, 128 152, 120 148" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="88" cy="95" rx="3.5" ry="5" fill="#1E293B"/>
    <ellipse cx="112" cy="95" rx="3.5" ry="5" fill="#1E293B"/>
    <circle cx="89.5" cy="93" r="1.5" fill="#FFFFFF"/>
    <circle cx="113.5" cy="93" r="1.5" fill="#FFFFFF"/>

    <!-- Cheeks -->
    <ellipse cx="80" cy="103" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>
    <ellipse cx="120" cy="103" rx="5" ry="3" fill="#FFB6C1" opacity="0.8"/>

    <!-- Mouth -->
    <path d="M 94 102 Q 100 108 106 102" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="62" y1="96" x2="52" y2="94" stroke="#334155" stroke-width="2"/>
    <line x1="62" y1="101" x2="54" y2="102" stroke="#334155" stroke-width="2"/>
    <line x1="138" y1="96" x2="148" y2="94" stroke="#334155" stroke-width="2"/>
    <line x1="138" y1="101" x2="146" y2="102" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
