<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Big Red X in Background -->
  <path d="M 45 45 L 155 155 M 155 45 L 45 155" stroke="#F87171" stroke-width="20" stroke-linecap="round" opacity="0.4"/>

  <text x="45" y="85" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="32" fill="#DC2626">N</text>
  <text x="45" y="118" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="32" fill="#DC2626">G</text>
  <text x="45" y="150" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="32" fill="#DC2626">！</text>

  <g transform="translate(20, 10)">
    <!-- Body -->
    <path d="M 70 160 C 65 125, 135 125, 130 160 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Ears -->
    <path d="M 68 88 L 52 58 L 82 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 69 82 L 58 63 L 78 72 Z" fill="#FFD1DC"/>
    <path d="M 132 88 L 148 58 L 118 72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 131 82 L 142 63 L 122 72 Z" fill="#FFD1DC"/>

    <!-- Head -->
    <ellipse cx="100" cy="98" rx="38" ry="32" fill="#FFFFFF" stroke="#334155" stroke-width="3.5"/>

    <!-- Antenna -->
    <line x1="100" y1="66" x2="100" y2="52" stroke="#334155" stroke-width="3"/>
    <circle cx="100" cy="50" r="6" fill="#FF5E80" stroke="#334155" stroke-width="2"/>
    <circle cx="98" cy="48" r="2" fill="#FFFFFF"/>

    <!-- Arms Crossed in X -->
    <path d="M 72 128 L 128 148 M 128 128 L 72 148" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M 72 128 L 128 148 M 128 128 L 72 148" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Angry / Cross Eyes (X X) -->
    <path d="M 83 91 L 93 101 M 93 91 L 83 101" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M 107 91 L 117 101 M 117 91 L 107 101" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Frown Mouth -->
    <path d="M 94 108 Q 100 102 106 108" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Puff of Anger Steam -->
    <path d="M 138 80 C 145 75, 150 85, 142 90 Z" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
  </g>
</svg>
